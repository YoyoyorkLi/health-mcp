<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Pulse Health Coach system architecture</title>
<desc>Claude connects over MCP to a Cloudflare Worker. Inside the Worker, an OAuth provider handles GitHub login and session state, and the PulseCoachMCP Durable Object holds the 9 read-only tools. The OAuth provider does a one-time GitHub OAuth login to identify the caller; the Durable Object signs in to Supabase with a plain password login (not OAuth) and queries it via PostgREST.</desc>

<rect x="0" y="0" width="680" height="480" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Client -->
<rect x="220" y="30" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Claude.ai / Claude Code</text>

<line x1="340" y1="74" x2="340" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="105" font-size="12" fill="#5F5E5A">MCP over HTTPS</text>

<!-- Outer: Cloudflare Worker -->
<rect x="60" y="130" width="560" height="210" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="155" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Cloudflare Worker</text>
<text x="340" y="173" text-anchor="middle" font-size="12" fill="#185FA5">pulse-coach-mcp.workers.dev</text>

<!-- Inner: OAuth provider -->
<rect x="90" y="210" width="230" height="130" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="205" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">OAuth provider</text>
<text x="205" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">GitHub login + sessions</text>

<!-- Inner: PulseCoachMCP -->
<rect x="360" y="210" width="230" height="130" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="475" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">PulseCoachMCP</text>
<text x="475" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Durable object, 9 tools</text>

<line x1="320" y1="275" x2="360" y2="275" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- External: GitHub OAuth -->
<rect x="105" y="390" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="205" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">GitHub OAuth</text>
<text x="205" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Identity provider only</text>

<line x1="205" y1="340" x2="205" y2="390" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225" y="368" font-size="12" fill="#5F5E5A">OAuth login, once</text>

<!-- External: Supabase -->
<rect x="365" y="390" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="475" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Supabase</text>
<text x="475" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Auth + PostgREST + Postgres</text>

<line x1="475" y1="340" x2="475" y2="390" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495" y="368" font-size="12" fill="#5F5E5A">Password login, automatic</text>
</svg>
